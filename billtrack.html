<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL CIENCO - Link Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #0a0a0a; color: #00ffc8; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1200px; width: 100%; }
        h1 { font-size: 2.5rem; border-bottom: 2px solid #00ffc8; padding-bottom: 10px; margin-bottom: 30px; text-shadow: 0 0 10px #00ffc8; }
        .card { background: #121212; border: 1px solid #00ffc8; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0,255,200,0.2); }
        .btn { background: #00ffc8; color: #0a0a0a; border: none; padding: 12px 24px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem; transition: 0.3s; }
        .btn:hover { background: #00cc9f; box-shadow: 0 0 20px #00ffc8; }
        input, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #00ffc8; border-radius: 4px; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #222; }
        th { background: #1a1a1a; color: #00ffc8; }
        tr:hover { background: #1a1a1a; }
        .link-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .link-box input { flex: 1; min-width: 200px; }
        .copy-btn { background: #333; color: #00ffc8; border: 1px solid #00ffc8; padding: 8px 16px; cursor: pointer; border-radius: 4px; }
        .copy-btn:hover { background: #00ffc8; color: #0a0a0a; }
        .badge { background: #00ffc8; color: #0a0a0a; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .map-placeholder { height: 300px; background: #1a1a1a; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: #555; margin-top: 10px; }
        .footer { margin-top: 40px; color: #555; font-size: 0.8rem; border-top: 1px solid #222; padding-top: 20px; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 EL CIENCO · TRACKER</h1>

        <!-- GENERATE LINK -->
        <div class="card">
            <h3>📌 Buat Link Baru</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="linkName" placeholder="Nama target (opsional)" style="flex: 1; min-width: 150px;">
                <button class="btn" onclick="generateLink()">⚡ GENERATE LINK</button>
            </div>
            <div class="link-box" id="linkResult" style="margin-top: 15px; display: none;">
                <input type="text" id="generatedLink" readonly>
                <button class="copy-btn" onclick="copyLink()">📋 Copy</button>
            </div>
        </div>

        <!-- DASHBOARD DATA -->
        <div class="card">
            <h3>📍 Data Tangkapan (real-time)</h3>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin: 10px 0;">
                <span>Total klik: <strong id="totalClicks">0</strong></span>
                <span>Terakhir: <strong id="lastClick">-</strong></span>
                <button class="btn" style="padding: 6px 12px; font-size: 0.8rem;" onclick="refreshData()">↻ Refresh</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>#</th><th>Waktu</th><th>IP</th><th>Lokasi</th><th>ISP</th><th>Device</th></tr>
                    </thead>
                    <tbody id="trackTable">
                        <tr><td colspan="6" style="text-align: center; color: #555;">Belum ada data</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PETA (simulasi) -->
        <div class="card">
            <h3>🗺️ Peta Lokasi (estimasi)</h3>
            <div class="map-placeholder" id="mapContainer">
                <span>📍 Klik link → data masuk → peta aktif</span>
            </div>
        </div>

        <!-- LOGS (RAW) -->
        <div class="card">
            <h3>📜 Log Mentah</h3>
            <textarea id="rawLog" rows="4" readonly style="font-size: 0.8rem; color: #aaa;"></textarea>
        </div>

        <div class="footer">
            EL CIENCO v.2310 · Sistem pelacak tanpa batas · Hanya untuk El Manco
        </div>
    </div>

    <script>
        // ========== SIMULASI DATABASE (localStorage) ==========
        let clicksData = JSON.parse(localStorage.getItem('elCiencoClicks')) || [];
        let linksData = JSON.parse(localStorage.getItem('elCiencoLinks')) || [];

        // ========== GENERATE LINK ==========
        function generateLink() {
            const id = 'trk_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
            const name = document.getElementById('linkName').value || 'target';
            const link = `${window.location.origin}${window.location.pathname}?id=${id}`;
            
            linksData.push({ id, name, created: new Date().toISOString() });
            localStorage.setItem('elCiencoLinks', JSON.stringify(linksData));
            
            document.getElementById('generatedLink').value = link;
            document.getElementById('linkResult').style.display = 'flex';
            
            // Simulasi pelacakan otomatis saat link diklik (di sini kita pura-pura ada klik baru)
            setTimeout(() => {
                // Untuk demo, tambahkan data palsu setiap 10 detik jika link dibuka (kita simulasi dengan tombol)
            }, 100);
        }

        function copyLink() {
            const input = document.getElementById('generatedLink');
            input.select();
            document.execCommand('copy');
            alert('Link copied!');
        }

        // ========== TAMBAH DATA PELACAKAN (SIMULASI) ==========
        function addFakeClick() {
            const cities = ['Jakarta', 'Bandung', 'Surabaya', 'Yogyakarta', 'Medan', 'Bali'];
            const countries = ['Indonesia', 'Malaysia', 'Singapura', 'Thailand'];
            const isps = ['Telkomsel', 'Indihome', 'Biznet', 'First Media', 'XL Axiata'];
            const devices = ['Chrome/Windows', 'Safari/iOS', 'Firefox/Linux', 'Edge/Android'];
            
            const newClick = {
                id: 'sim_' + Date.now(),
                link_id: 'trk_demo',
                ip: `192.168.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`,
                user_agent: devices[Math.floor(Math.random() * devices.length)],
                lat: -6.2 + (Math.random() - 0.5) * 2,
                lon: 106.8 + (Math.random() - 0.5) * 2,
                city: cities[Math.floor(Math.random() * cities.length)],
                country: countries[Math.floor(Math.random() * countries.length)],
                isp: isps[Math.floor(Math.random() * isps.length)],
                created_at: new Date().toISOString()
            };
            
            clicksData.unshift(newClick);
            localStorage.setItem('elCiencoClicks', JSON.stringify(clicksData));
            renderTable();
            updateStats();
            updateMap(newClick);
        }

        // ========== RENDER TABLE ==========
        function renderTable() {
            const tbody = document.getElementById('trackTable');
            if (clicksData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #555;">Belum ada data</td></tr>`;
                return;
            }
            tbody.innerHTML = clicksData.slice(0, 20).map((c, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${new Date(c.created_at).toLocaleString()}</td>
                    <td>${c.ip}</td>
                    <td>${c.city || '-'}, ${c.country || '-'}</td>
                    <td>${c.isp || '-'}</td>
                    <td>${c.user_agent?.slice(0, 20) || '-'}...</td>
                </tr>
            `).join('');
            
            // Raw log
            document.getElementById('rawLog').value = JSON.stringify(clicksData.slice(0, 5), null, 2);
        }

        function updateStats() {
            document.getElementById('totalClicks').textContent = clicksData.length;
            if (clicksData.length > 0) {
                document.getElementById('lastClick').textContent = new Date(clicksData[0].created_at).toLocaleString();
            }
        }

        // ========== UPDATE PETA (Leaflet via CDN) ==========
        function updateMap(click) {
            if (!click.lat || !click.lon) return;
            const container = document.getElementById('mapContainer');
            // Load Leaflet jika belum
            if (!document.getElementById('leaflet-css')) {
                const css = document.createElement('link');
                css.id = 'leaflet-css';
                css.rel = 'stylesheet';
                css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                document.head.appendChild(css);
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                script.onload = () => initMap(click);
                document.head.appendChild(script);
            } else {
                initMap(click);
            }
        }

        let mapInstance = null;

        function initMap(click) {
            if (mapInstance) {
                mapInstance.setView([click.lat, click.lon], 13);
                L.marker([click.lat, click.lon]).addTo(mapInstance)
                  .bindPopup(`📍 ${click.city || 'Unknown'}<br>IP: ${click.ip}`);
                return;
            }
            
            mapInstance = L.map('mapContainer').setView([click.lat, click.lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(mapInstance);
            L.marker([click.lat, click.lon]).addTo(mapInstance)
              .bindPopup(`📍 ${click.city || 'Unknown'}<br>IP: ${click.ip}`);
            
            document.getElementById('mapContainer').style.border = '1px solid #00ffc8';
        }

        // ========== REFRESH ==========
        function refreshData() {
            clicksData = JSON.parse(localStorage.getItem('elCiencoClicks')) || [];
            renderTable();
            updateStats();
            if (clicksData.length > 0) updateMap(clicksData[0]);
        }

        // ========== SIMULASI LINK DIBUKA (otomatis jika ada parameter ?id=) ==========
        function handleLinkOpen() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (id) {
                // Ini simulasi: tambahkan 1 data fake
                addFakeClick();
                // Hapus parameter dari URL agar ga double
                window.history.replaceState({}, document.title, window.location.pathname);
                alert('🔔 Link dilacak! Data tersimpan.'); // buat efek
            }
        }

        // ========== INIT ==========
        renderTable();
        updateStats();
        handleLinkOpen();

        // Auto tambah data setiap 30 detik untuk demo (bisa dihapus)
        setInterval(() => {
            if (Math.random() > 0.6) addFakeClick();
        }, 30000);
    </script>
</body>
</html>
